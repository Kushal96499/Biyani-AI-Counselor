<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyani AI - Professional Admin Panel</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        biyani: { red: '#8b0000', blue: '#001e61', lightbg: '#f8f9fa' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8f9fa; color: #333; margin: 0; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .shadow-soft { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const AdminApp = () => {
            const [token, setToken] = useState(localStorage.getItem('adminToken') || '');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [stats, setStats] = useState(null);
            
            // Add Data State
            const [manualText, setManualText] = useState('');
            const MAX_TEXT_LIMIT = 100000;
            const [sourceName, setSourceName] = useState('');
            const [urlToScrape, setUrlToScrape] = useState('');
            const [loading, setLoading] = useState(false);
            const [notification, setNotification] = useState({ show: false, text: '', type: 'info' });

            // Memory Manager State
            const [searchQuery, setSearchQuery] = useState('');
            const [chunks, setChunks] = useState([]);
            
            // Logs State
            const [logs, setLogs] = useState([]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.endsWith('.txt')) {
                    showNotification('Please upload a .txt file.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    setManualText(event.target.result);
                    if (!sourceName) setSourceName(file.name.replace('.txt', ''));
                    showNotification('File loaded successfully! You can now edit and save.', 'success');
                };
                reader.readAsText(file);
            };

            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.name.endsWith('.pdf')) {
                    showNotification('Please upload a .pdf file.', 'error');
                    return;
                }

                setLoading(true);
                showNotification(`Uploading and processing ${file.name}...`, 'info');

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const res = await fetch('/api/admin/upload-pdf', {
                        method: 'POST',
                        headers: { 'X-Admin-Token': token },
                        body: formData
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showNotification(`✅ PDF processed successfully!`, 'success');
                        fetchStats();
                    } else {
                        showNotification('❌ ' + (data.detail || 'Upload failed.'), 'error');
                    }
                } catch (err) {
                    showNotification('❌ Network Error.', 'error');
                }
                setLoading(false);
                e.target.value = '';
            };

            const showNotification = (text, type = 'success') => {
                setNotification({ show: true, text, type });
                setTimeout(() => setNotification({ show: false, text: '', type: 'info' }), 6000);
            };

            useEffect(() => {
                if (token) checkAuth();
            }, []);

            const checkAuth = async () => {
                try {
                    const res = await fetch('/api/admin/stats', { headers: { 'X-Admin-Token': token } });
                    if (res.ok) {
                        setIsLoggedIn(true);
                        localStorage.setItem('adminToken', token);
                        fetchStats();
                    } else {
                        setIsLoggedIn(false);
                        localStorage.removeItem('adminToken');
                    }
                } catch (e) {
                    setIsLoggedIn(false);
                }
            };

            const fetchStats = async () => {
                try {
                    const res = await fetch('/api/admin/stats', { headers: { 'X-Admin-Token': token } });
                    const data = await res.json();
                    setStats(data);
                } catch(e){}
            };

            const fetchLogs = async () => {
                try {
                    const res = await fetch('/api/admin/logs', { headers: { 'X-Admin-Token': token } });
                    const data = await res.json();
                    setLogs(data.logs || []);
                } catch(e){}
            };
            
            const handleSearchChunks = async (e) => {
                e.preventDefault();
                setLoading(true);
                setChunks([]);
                try {
                    const res = await fetch(`/api/admin/search-chunks?q=${encodeURIComponent(searchQuery)}`, {
                        headers: { 'X-Admin-Token': token }
                    });
                    const data = await res.json();
                    if(data.chunks && data.chunks.length > 0) {
                        setChunks(data.chunks);
                        showNotification(`Found ${data.chunks.length} chunks successfully.`, 'success');
                    } else {
                        showNotification(`No data found for "${searchQuery}". It might not exist in the active collection.`, 'info');
                    }
                } catch (err) {
                    showNotification('Error connecting to the database.', 'error');
                }
                setLoading(false);
            };

            const handleDeleteChunk = async (id) => {
                if(!confirm("Warning: Deleting this data is permanent. Continue?")) return;
                try {
                    const res = await fetch(`/api/admin/delete-chunk/${id}`, {
                        method: 'DELETE',
                        headers: { 'X-Admin-Token': token }
                    });
                    if(res.ok) {
                        showNotification('✅ Data deleted successfully.', 'success');
                        setChunks(chunks.filter(c => c.id !== id));
                        fetchStats();
                    } else {
                        showNotification('❌ Failed to delete data.', 'error');
                    }
                } catch(e) {
                    showNotification('❌ Network Error.', 'error');
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                checkAuth();
            };

            const handleAddText = async (e) => {
                e.preventDefault();
                setLoading(true);
                showNotification('Processing text and saving to database... Please wait.', 'info');
                try {
                    const res = await fetch('/api/admin/add-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
                        body: JSON.stringify({ text: manualText, source_name: sourceName || 'Manual Entry' })
                    });
                    const data = await res.json();
                    if(res.ok) {
                        showNotification(`✅ Success! Text added to AI knowledge. (${data.message})`, 'success');
                        setManualText(''); setSourceName(''); fetchStats();
                    } else {
                        showNotification('❌ ' + (data.detail || 'Upload failed.'), 'error');
                    }
                } catch (err) { showNotification('❌ Network Error.', 'error'); }
                setLoading(false);
            };

            const handleScrapeUrl = async (e) => {
                e.preventDefault();
                setLoading(true);
                showNotification('Extracting text from website and saving... Please wait.', 'info');
                try {
                    const res = await fetch('/api/admin/scrape', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
                        body: JSON.stringify({ url: urlToScrape })
                    });
                    const data = await res.json();
                    if(res.ok) {
                        showNotification(`✅ URL Scraped Successfully! (${data.message})`, 'success');
                        setUrlToScrape(''); fetchStats();
                    } else {
                        showNotification('❌ ' + (data.detail || 'Scraping failed.'), 'error');
                    }
                } catch (err) { showNotification('❌ Network Error.', 'error'); }
                setLoading(false);
            };

            const handleClearDB = async () => {
                const pass = prompt("SECURITY CHECK: You are about to permanently delete all AI data.\n\nPlease enter the Admin Password to verify:");
                if (pass === null) return; // User clicked Cancel
                if (pass !== token) {
                    showNotification('❌ Incorrect password. Deletion cancelled.', 'error');
                    return;
                }
                
                if (!confirm("Password verified. Are you 100% completely SURE you want to wipe the database? This cannot be undone.")) return;
                
                setLoading(true);
                showNotification('Deleting all data...', 'info');
                try {
                    const res = await fetch('/api/admin/clear', { method: 'POST', headers: { 'X-Admin-Token': token }});
                    if(res.ok) { showNotification('✅ Database cleared successfully.', 'success'); fetchStats(); }
                    else { showNotification('❌ Failed to clear database.', 'error'); }
                } catch (err) { showNotification('❌ Network error.', 'error'); }
                setLoading(false);
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-100">
                        <div className="bg-white p-10 max-w-md w-full rounded-2xl shadow-soft border-t-8 border-biyani-red relative">
                            <div className="flex justify-center mb-6">
                                <img src="/assets/Biyani_college_logo.jpg" alt="Logo" className="h-20 object-contain" onError={(e)=>{e.target.style.display='none'}} />
                            </div>
                            <h2 className="text-2xl font-bold text-center text-biyani-blue mb-1">Biyani AI Admin</h2>
                            <p className="text-gray-500 text-center mb-8 text-sm">Authorized Access Only</p>
                            
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="text-sm font-semibold text-gray-700 block mb-2">Admin Password</label>
                                    <input type="password" placeholder="Enter password..." value={token} onChange={(e) => setToken(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-biyani-red focus:border-transparent transition-all" required />
                                </div>
                                <button type="submit" className="w-full bg-biyani-red hover:bg-red-900 text-white p-3 rounded-lg font-bold transition-all shadow-md">
                                    Login
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex overflow-hidden bg-gray-50">
                    {/* Professional Sidebar */}
                    <div className="w-64 bg-white shadow-soft z-10 flex flex-col border-r border-gray-200">
                        <div className="p-6 border-b border-gray-100 flex flex-col items-center">
                            <img src="/assets/Biyani_college_logo.jpg" alt="Logo" className="h-16 object-contain mb-3" onError={(e)=>{e.target.style.display='none'}} />
                            <h1 className="font-bold text-lg text-biyani-blue">AI Control Panel</h1>
                            <div className="flex items-center gap-2 text-xs font-semibold text-green-600 mt-1 bg-green-50 px-2 py-1 rounded-full border border-green-200">
                                <span className="h-2 w-2 rounded-full bg-green-500 animate-pulse"></span> Online
                            </div>
                        </div>
                        
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all flex items-center gap-3 ${activeTab === 'dashboard' ? 'bg-biyani-red text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>
                                📊 Dashboard
                            </button>
                            <button onClick={() => setActiveTab('addData')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all flex items-center gap-3 ${activeTab === 'addData' ? 'bg-biyani-red text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>
                                ➕ Add Knowledge
                            </button>
                            <button onClick={() => setActiveTab('memory')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all flex items-center gap-3 ${activeTab === 'memory' ? 'bg-biyani-red text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>
                                🔍 Edit Memory
                            </button>
                            <button onClick={() => { setActiveTab('logs'); fetchLogs(); }} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all flex items-center gap-3 ${activeTab === 'logs' ? 'bg-biyani-red text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`}>
                                📜 Chat Logs
                            </button>
                            
                            <div className="mt-8 pt-4 border-t border-gray-100">
                                <button onClick={() => setActiveTab('settings')} className={`w-full text-left px-4 py-3 rounded-lg font-medium transition-all flex items-center gap-3 ${activeTab === 'settings' ? 'bg-red-50 text-red-700 border border-red-200' : 'text-red-600 hover:bg-red-50'}`}>
                                    ⚠️ Clear Data
                                </button>
                            </div>
                        </nav>

                        <div className="p-4 border-t border-gray-100">
                            <button onClick={() => { setIsLoggedIn(false); localStorage.removeItem('adminToken'); }} className="w-full py-2 text-sm text-gray-500 font-semibold hover:text-biyani-red transition">
                                Logout
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 p-6 lg:p-10 overflow-y-auto h-full scroll-smooth bg-[#f8f9fa]">
                        
                        {/* Global Notification system */}
                        {notification.show && (
                            <div className={`fixed top-8 right-8 z-50 p-4 rounded-xl shadow-lg font-medium border-l-4 transition-all duration-300 max-w-md animate-[bounce_0.3s_ease-out]
                                ${notification.type === 'success' ? 'bg-white border-green-500 text-green-700' : 
                                  notification.type === 'error' ? 'bg-white border-red-500 text-red-700' : 
                                  'bg-white border-blue-500 text-blue-700'}`}>
                                <div className="flex items-start gap-3">
                                    {notification.type === 'info' && (
                                        <svg className="animate-spin h-5 w-5 mt-0.5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                    )}
                                    <p className="text-sm leading-relaxed">{notification.text}</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'dashboard' && (
                            <div className="max-w-6xl mx-auto animate-in fade-in duration-500">
                                <header className="mb-10 flex justify-between items-end">
                                    <div>
                                        <h2 className="text-4xl font-extrabold text-biyani-blue tracking-tight">Dashboard</h2>
                                        <p className="text-gray-500 mt-1 font-medium">Real-time system intelligence & analytics</p>
                                    </div>
                                    <button onClick={fetchStats} className="bg-white border border-gray-200 px-4 py-2 rounded-lg text-sm font-bold text-gray-600 hover:bg-gray-50 transition shadow-sm">
                                        Refresh Data
                                    </button>
                                </header>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                                    <div className="bg-white p-8 rounded-2xl shadow-soft border-b-4 border-biyani-red relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition">
                                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                                        </div>
                                        <h3 className="text-gray-500 font-bold uppercase tracking-wider text-xs mb-3">Knowledge Base</h3>
                                        <p className="text-5xl font-black text-biyani-blue">{stats ? stats.points_count.toLocaleString() : '...'}</p>
                                        <p className="text-sm text-gray-400 mt-2 font-medium">Data Chunks Indexed</p>
                                    </div>

                                    <div className="bg-gradient-to-br from-biyani-blue to-blue-900 p-8 rounded-2xl shadow-lg text-white relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-30 transition">
                                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 2a10 10 0 0 1 10 10h-10V2z"></path><path d="M12 12L2.2 9"></path><path d="M12 12L19 5"></path></svg>
                                        </div>
                                        <h3 className="text-blue-200 font-bold uppercase tracking-wider text-xs mb-3">AI Intelligence</h3>
                                        <p className="text-3xl font-black mb-1">NVIDIA NIM</p>
                                        <div className="flex items-center gap-2 mt-3">
                                            <span className="h-2 w-2 rounded-full bg-green-400 animate-pulse"></span>
                                            <span className="text-xs font-bold text-blue-100">Nemotron 300M Active</span>
                                        </div>
                                    </div>

                                    <div className="bg-white p-8 rounded-2xl shadow-soft border-b-4 border-blue-500 relative overflow-hidden group">
                                        <div className="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition">
                                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                        </div>
                                        <h3 className="text-gray-500 font-bold uppercase tracking-wider text-xs mb-3">Chat Logic</h3>
                                        <p className="text-3xl font-black text-biyani-blue">Llama 3.3</p>
                                        <p className="text-sm text-gray-400 mt-2 font-medium">Groq Accelerated 🚀</p>
                                    </div>
                                </div>
                                
                                <h3 className="text-2xl font-bold text-biyani-blue mb-6 flex items-center gap-3">
                                    <span className="bg-red-100 p-2 rounded-lg text-biyani-red">📈</span>
                                    Lifetime Interaction Analytics
                                </h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="bg-white p-10 rounded-2xl shadow-soft border border-gray-100 flex items-center justify-between group hover:border-biyani-red transition-all">
                                        <div>
                                            <p className="text-gray-500 font-bold text-sm uppercase tracking-widest mb-1">Total Student Queries</p>
                                            <p className="text-6xl font-black text-biyani-red tracking-tighter">
                                                {stats ? stats.total_questions : '0'}
                                            </p>
                                            <p className="text-xs text-gray-400 mt-2 font-medium">Persistent Log-based Data</p>
                                        </div>
                                        <div className="bg-red-50 p-6 rounded-full text-biyani-red group-hover:scale-110 transition">
                                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                        </div>
                                    </div>

                                    <div className="bg-white p-10 rounded-2xl shadow-soft border border-gray-100 flex items-center justify-between group hover:border-biyani-blue transition-all">
                                        <div>
                                            <p className="text-gray-500 font-bold text-sm uppercase tracking-widest mb-1">Unique Counselor Sessions</p>
                                            <p className="text-6xl font-black text-biyani-blue tracking-tighter">
                                                {stats ? stats.unique_sessions : '0'}
                                            </p>
                                            <p className="text-xs text-gray-400 mt-2 font-medium">Across Different Time Slots</p>
                                        </div>
                                        <div className="bg-blue-50 p-6 rounded-full text-biyani-blue group-hover:scale-110 transition">
                                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'addData' && (
                            <div className="max-w-6xl mx-auto">
                                <header className="mb-8">
                                    <h2 className="text-3xl font-extrabold text-biyani-blue mb-1">Add Knowledge</h2>
                                    <p className="text-gray-500">Provide new information to the chatbot instantly.</p>
                                </header>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    <div className="bg-white p-8 rounded-xl shadow-soft border border-gray-100">
                                        <h3 className="text-xl font-bold text-biyani-red mb-1">Option 1: Manual Text Entry</h3>
                                        <p className="text-sm text-gray-500 mb-6">Type or paste any notice, event detail, or FAQ.</p>
                                        
                                        <form onSubmit={handleAddText} className="space-y-4">
                                            <div>
                                                <label className="text-sm font-semibold text-gray-700 mb-1 block">Title / Source Name</label>
                                                <input type="text" placeholder="e.g., 'Biyani Fee Update 2024'" value={sourceName} onChange={e=>setSourceName(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-biyani-red" required />
                                            </div>
                                             <div>
                                                <div className="flex justify-between items-end mb-1">
                                                    <label className="text-sm font-semibold text-gray-700 block">Information Text</label>
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${manualText.length > MAX_TEXT_LIMIT * 0.9 ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-500'}`}>
                                                        {manualText.length.toLocaleString()} / {MAX_TEXT_LIMIT.toLocaleString()} characters
                                                    </span>
                                                </div>
                                                 <textarea rows="8" placeholder="Paste the text information here..." value={manualText} onChange={e=>{if(e.target.value.length <= MAX_TEXT_LIMIT) setManualText(e.target.value)}} className="w-full p-3 border border-gray-300 rounded-lg resize-none outline-none focus:ring-2 focus:ring-biyani-red" required></textarea>
                                                 <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mt-2 gap-3">
                                                    <p className="text-[10px] text-gray-400 italic max-w-[200px] sm:max-w-xs">Large texts will be automatically split into optimized chunks for AI memory.</p>
                                                    <div className="flex items-center gap-2 self-end sm:self-auto">
                                                        <div className="relative">
                                                            <input type="file" accept=".txt" onChange={handleFileUpload} className="hidden" id="txt-upload" />
                                                            <label htmlFor="txt-upload" className="text-[10px] bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md font-bold cursor-pointer transition border border-gray-200 whitespace-nowrap flex items-center gap-1">
                                                                📁 .txt
                                                            </label>
                                                        </div>
                                                        <div className="relative">
                                                            <input type="file" accept=".pdf" onChange={handlePdfUpload} className="hidden" id="pdf-upload" />
                                                            <label htmlFor="pdf-upload" className="text-[10px] bg-red-50 hover:bg-red-100 text-red-700 px-3 py-1.5 rounded-md font-bold cursor-pointer transition border border-red-200 whitespace-nowrap flex items-center gap-1">
                                                                📄 PDF
                                                            </label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <button disabled={loading} type="submit" className="w-full bg-biyani-blue hover:bg-blue-900 text-white p-3 rounded-lg font-bold transition disabled:opacity-50">
                                                {loading ? 'Processing...' : 'Save Information'}
                                            </button>
                                            <p className="text-[10px] text-center text-green-600 font-semibold mt-1">✨ Auto-clears Redis cache for instant updates</p>
                                        </form>
                                    </div>

                                    <div className="bg-white p-8 rounded-xl shadow-soft border border-gray-100">
                                        <h3 className="text-xl font-bold text-biyani-red mb-1">Option 2: Website Link</h3>
                                        <p className="text-sm text-gray-500 mb-4">Let the AI read a page from your website directly.</p>

                                        <div className="bg-blue-50 border border-blue-100 p-4 rounded-lg mb-6 text-sm text-blue-800 leading-relaxed">
                                            <strong>How it works:</strong>
                                            <ul className="list-disc pl-5 mt-2 space-y-1">
                                                <li>Paste any Biyani website link (e.g., about admissions).</li>
                                                <li>The system reads the visible text automatically.</li>
                                                <li>Please wait 5-10 seconds while it saves the data.</li>
                                            </ul>
                                        </div>

                                        <form onSubmit={handleScrapeUrl} className="space-y-4">
                                            <div>
                                                <label className="text-sm font-semibold text-gray-700 mb-1 block">Website URL</label>
                                                <input type="url" placeholder="https://www.biyanicolleges.org/..." value={urlToScrape} onChange={e=>setUrlToScrape(e.target.value)} className="w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-biyani-red" required />
                                            </div>
                                            <button disabled={loading} type="submit" className="w-full bg-biyani-red hover:bg-red-900 text-white p-3 rounded-lg font-bold transition disabled:opacity-50">
                                                {loading ? 'Extracting Data...' : 'Scrape Website'}
                                            </button>
                                            <p className="text-[10px] text-center text-green-600 font-semibold mt-1">✨ Auto-clears Redis cache for instant updates</p>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'memory' && (
                            <div className="max-w-6xl mx-auto flex flex-col h-full">
                                <header className="mb-6">
                                    <h2 className="text-3xl font-extrabold text-biyani-blue mb-1">Edit Memory</h2>
                                    <p className="text-gray-500">Search for specific saved information and delete outdated details.</p>
                                </header>
                                
                                <div className="bg-white p-6 rounded-xl shadow-soft border border-gray-100 mb-6">
                                    <form onSubmit={handleSearchChunks} className="flex gap-4">
                                        <input type="text" placeholder="Search saved info (e.g., 'fees', 'sakura')..." value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} className="flex-1 p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-biyani-red text-lg" required />
                                        <button disabled={loading} type="submit" className="bg-biyani-blue hover:bg-blue-900 text-white px-8 rounded-lg font-bold transition disabled:opacity-50 whitespace-nowrap">
                                            Search Data
                                        </button>
                                    </form>
                                    <p className="text-sm text-gray-500 mt-3">This searches the AI database exactly the way the chatbot does to find relevant information.</p>
                                </div>
                                
                                <div className="space-y-4 pb-10">
                                    {chunks.map((c, i) => (
                                        <div key={i} className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row gap-6 items-start hover:shadow-md transition">
                                            <div className="flex-1 w-full">
                                                <div className="flex items-center gap-3 mb-3">
                                                    <span className="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">
                                                        Match Score: {(c.score * 100).toFixed(1)}%
                                                    </span>
                                                </div>
                                                <div className="bg-gray-50 p-4 rounded-lg border border-gray-100 text-gray-800 text-sm leading-relaxed mb-3">
                                                    {c.payload && c.payload.text ? c.payload.text : <span className="italic text-gray-500">Empty data.</span>}
                                                </div>
                                                <div className="text-xs font-semibold text-biyani-blue bg-blue-50 inline-block px-3 py-1 rounded">
                                                    Source: {c.payload ? (c.payload.url || c.payload.title || c.payload.source_type || 'Unknown') : 'Unknown'}
                                                </div>
                                            </div>
                                            <div className="w-full md:w-auto">
                                                <button onClick={() => handleDeleteChunk(c.id)} className="w-full md:w-auto px-6 py-2 bg-red-50 text-red-600 hover:bg-red-600 hover:text-white border border-red-200 rounded-lg text-sm font-bold transition">
                                                    Delete
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                    {chunks.length === 0 && !loading && (
                                        <div className="bg-white p-10 text-center rounded-xl border-2 border-dashed border-gray-300">
                                            <p className="text-lg text-gray-600 font-semibold">No data showing right now.</p>
                                            <p className="text-sm text-gray-500 mt-1">Search for a word above to see saved AI memory.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'logs' && (
                            <div className="max-w-6xl mx-auto">
                                <header className="mb-8">
                                    <h2 className="text-3xl font-extrabold text-biyani-blue mb-1">Chat Logs</h2>
                                    <p className="text-gray-500">Read what students are asking the chatbot right now.</p>
                                </header>
                                
                                <div className="space-y-6">
                                    {logs.length === 0 ? (
                                        <div className="bg-white p-10 text-center rounded-xl shadow-soft border border-gray-100">
                                            <p className="text-gray-500 font-semibold">No one has chatted with the bot today yet.</p>
                                        </div>
                                    ) : null}
                                    
                                    {logs.map((session, i) => (
                                        <div key={i} className="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden">
                                            <div className="bg-gray-50 p-4 border-b border-gray-100 flex justify-between items-center">
                                                <div className="font-semibold text-gray-700 text-sm">User IP: {session.ip}</div>
                                                <div className="text-xs font-bold text-biyani-blue bg-blue-100 px-3 py-1 rounded-full">{session.messages.length} messages</div>
                                            </div>
                                            <div className="p-6 space-y-4 max-h-[500px] overflow-y-auto bg-[#f8f9fa]">
                                                {session.messages.map((m, j) => (
                                                    <div key={j} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                        <div className={`max-w-[80%] p-4 rounded-xl ${
                                                            m.role === 'user' 
                                                            ? 'bg-biyani-blue text-white rounded-tr-none' 
                                                            : 'bg-white border border-gray-200 text-gray-800 rounded-tl-none shadow-sm'
                                                        }`}>
                                                            <div className="text-xs font-bold mb-1 opacity-70">
                                                                {m.role === 'user' ? 'Student' : 'Biyani AI'}
                                                            </div>
                                                            <div className="text-sm leading-relaxed whitespace-pre-wrap">{m.content}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="max-w-4xl mx-auto">
                                <header className="mb-8">
                                    <h2 className="text-3xl font-extrabold text-biyani-red mb-1">Danger Zone</h2>
                                    <p className="text-gray-500">Be careful. These actions cannot be undone.</p>
                                </header>
                                
                                <div className="bg-white p-8 rounded-xl shadow-soft border border-red-200 relative overflow-hidden">
                                    <div className="flex flex-col md:flex-row gap-8 items-center justify-between">
                                        <div>
                                            <h3 className="text-xl font-bold text-biyani-red mb-2">Clear Entire Database</h3>
                                            <p className="text-gray-600 text-sm max-w-lg">This will delete all the information you have added so far. The chatbot will instantly forget everything and you will have to add information again.</p>
                                        </div>
                                        <div className="flex flex-col items-center gap-2">
                                            <button disabled={loading} onClick={handleClearDB} className="bg-red-600 hover:bg-red-800 text-white px-6 py-4 rounded-lg font-bold transition shadow-md whitespace-nowrap">
                                                Delete All Data
                                            </button>
                                            <p className="text-[10px] text-red-500 font-bold">Wipes Redis Cache too</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminApp />);
    </script>
</body>
</html>
