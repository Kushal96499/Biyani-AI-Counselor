<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biyani AI Assistant | Professional Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            font-family: 'Outfit', sans-serif;
            background-color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* FULL IMMERSIVE SHELL */
        .app-shell {
            display: flex;
            height: 100vh;
            width: 100vw !important;
            background: #fff;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* SIDEBAR - DESKTOP ONLY */
        .sidebar {
            display: none;
            width: 420px;
            height: 100%;
            background: #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            opacity: 0.85;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* CHAT AREA - EDGE TO EDGE FORCE */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            width: 100% !important;
            position: relative;
        }

        .nav-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .website-btn {
            background: #8b0000;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .website-btn:hover {
            background: #ffffff;
            color: #8b0000;
            border-color: #8b0000;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.2);
        }

        @media (min-width: 640px) {
            .website-btn {
                padding: 0.6rem 1.4rem;
                font-size: 0.75rem;
                gap: 0.5rem;
            }
        }

        .msg-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            /* MASSIVE PADDING TO PREVENT OVERLAP WITH FLOATING INPUT */
            padding-bottom: 90px;
            scroll-behavior: smooth;
        }

        .msg-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* BUBBLES */
        .ai-row {
            display: flex;
            align-items: flex-start;
            max-width: 95%;
            margin-right: auto;
        }

        .user-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-left: auto;
        }

        .bubble-ai {
            background: #ffffff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-left-radius: 0.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            color: #333;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .bubble-user {
            background: #001e61;
            color: #fff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-right-radius: 0.2rem;
            max-width: 85%;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 30, 97, 0.15);
        }

        /* FLOATING CONTROLS - FIXED AT BOTTOM */
        .floating-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 1rem;
            pointer-events: none;
            z-index: 200;
            background: linear-gradient(to top, white 60%, transparent 100%);
        }

        .floating-inner {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .pills-row {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 10px 5px;
            scrollbar-width: none;
            justify-content: flex-start;
        }

        .pills-row::-webkit-scrollbar {
            display: none;
        }

        .pill {
            background: white;
            color: #8b0000;
            border: 1.8px solid #8b0000;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .pill:hover {
            background: #8b0000;
            color: #fff;
            transform: translateY(-5px);
        }

        .search-bar {
            background: #ffffff;
            border-radius: 4rem;
            padding: 0.5rem 0.6rem 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            border: 1px solid #eee;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .send-btn {
            background: #8b0000;
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* BRANDING */
        .branding {
            text-align: center;
            margin-top: 0.6rem;
            opacity: 0.4;
        }

        .branding-text {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.25em;
            color: #000;
            text-transform: uppercase;
        }

        /* AVATAR */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid #f0f0f0;
            background: #fff;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 640px) {
            .msg-scroll {
                padding-bottom: 200px !important;
            }

            .bubble-ai,
            .bubble-user {
                font-size: 0.85rem;
                padding: 0.8rem 1.1rem;
            }

            .floating-controls {
                padding: 0.8rem 0.5rem;
            }

            .pill {
                padding: 0.4rem 1rem;
                font-size: 0.72rem;
            }

            .search-bar {
                padding: 0.4rem 0.5rem 0.4rem 1.2rem;
            }

            .send-btn {
                width: 40px;
                height: 40px;
            }

            .nav-header {
                padding: 0.6rem 0.8rem;
                gap: 0.5rem;
            }
        }

        /* DESKTOP MEDIA */
        @media (min-width: 1025px) {
            .sidebar {
                display: block;
            }

            .nav-header {
                padding: 1.2rem 3.5rem;
            }

            .msg-scroll {
                padding: 2rem 5rem;
            }

            .pills-row {
                justify-content: center;
            }
        }

        /* FORMATTING */
        .formatted b {
            font-weight: 700;
            color: #8b0000;
        }

        .formatted li {
            margin-left: 1.4rem;
            list-style-type: disc;
            margin-bottom: 0.6rem;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const ChatApp = () => {
            const [messages, setMessages] = useState([
                {
                    role: 'assistant',
                    content: 'Dear student,\nWelcome to Biyani AI Assistant. This AI chatbot has been developed after 20 years of teaching experience of team. It will help you with correct answers for all the complex questions of academic subjects. However, consult your teacher before any final decision.\n\n**-Team Biyani.**'
                }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                const container = document.querySelector('.msg-scroll');
                if (container && scrollRef.current) {
                    // Only auto-scroll if user is near the bottom (within 100px)
                    const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 150;
                    
                    if (isAtBottom) {
                        scrollRef.current.scrollIntoView({ behavior: "smooth", block: "end" });
                    }
                }
            }, [messages, status]);

            const format = (text) => {
                // 1. Detect explicit tags: [PDF: https://url.pdf]
                let pdfMatch = text.match(/\[PDF:\s*(.*?)\]/);
                let cleanText = text.replace(/\[PDF:\s*(.*?)\]/g, '');

                // 2. Fallback: Detect raw PDF links if no tag is found
                let pdfUrl = pdfMatch ? pdfMatch[1] : null;
                if (!pdfUrl) {
                    const rawMatch = text.match(/https?:\/\/[^\s]+\.pdf/i);
                    if (rawMatch) pdfUrl = rawMatch[0];
                }

                let html = cleanText
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/^\s*[\-\*\+]\s+(.*)/gm, '<li>$1</li>')
                    .replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul class="list-disc ml-5 mb-2">$1</ul>')
                    .replace(/\n/g, '<br/>');

                return { html, pdfUrl };
            };

            const type = (full, pdf) => {
                let current = ""; let idx = 0; setIsTyping(true);
                setMessages(p => [...p, { role: 'assistant', content: '', pdfUrl: null }]); // Start without PDF
                const timer = setInterval(() => {
                    if (idx < full.length) {
                        current += full[idx++];
                        setMessages(prev => {
                            const last = prev[prev.length - 1];
                            return [...prev.slice(0, -1), { ...last, content: current }];
                        });
                    } else { 
                        clearInterval(timer); 
                        setIsTyping(false);
                        // ONLY SHOW PDF AFTER TYPING IS FINISHED
                        if (pdf) {
                            setMessages(prev => {
                                const last = prev[prev.length - 1];
                                return [...prev.slice(0, -1), { ...last, pdfUrl: pdf }];
                            });
                        }
                    }
                }, 10);
            };

            const send = async (val) => {
                const text = val || input.trim();
                if (!text || isTyping) return;
                setInput('');
                setMessages(p => [...p, { role: 'user', content: text }]);
                setStatus('Consulting AI counselor...');
                try {
                    const res = await fetch('http://localhost:8000/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, history: messages.slice(-6) })
                    });
                    
                    const data = await res.json();
                    setStatus('');
                    if (data.answer) {
                        type(data.answer, data.pdf_url); // Pass both to typing engine
                    }
                } catch (e) { setStatus(''); setMessages(p => [...p, { role: 'assistant', content: "Connection failed." }]); }
            };

            return (
                <div className="app-shell">
                    <aside className="sidebar">
                        <img src="./assets/AI_image.png" className="hero-img" alt="Biyani" />
                        <div className="sidebar-overlay"></div>
                    </aside>
                    <main className="chat-area">
                        <header className="nav-header">
                            <div className="flex items-center gap-3 sm:gap-4">
                                <div className="p-1 bg-white rounded-lg shadow-md border border-gray-100 flex-shrink-0">
                                    <img src="./assets/Biyani_college_logo.jpg" className="h-7 w-7 sm:h-10 sm:w-10 object-contain" />
                                </div>
                                <div className="flex flex-col min-w-0">
                                    <h2 className="font-extrabold text-gray-900 text-[15px] sm:text-[22px] tracking-tight leading-tight truncate">Biyani AI Counselor</h2>
                                </div>
                            </div>
                            <a href="https://www.biyanicolleges.org" target="_blank" className="website-btn">
                                <span className="hidden sm:inline">Official</span> Website
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>
                            </a>
                        </header>

                        <div className="msg-scroll">
                            <div className="msg-inner">
                                {messages.map((m, i) => {
                                    const { html, pdfUrl: textPdfUrl } = format(m.content);
                                    const finalPdfUrl = m.pdfUrl || textPdfUrl;
                                    return (
                                        <div key={i} className={m.role === 'user' ? 'user-row' : 'ai-row'}>
                                            {m.role === 'assistant' && (
                                                <div className="avatar">
                                                    <img src="./assets/Biyani_college_logo.jpg" className="avatar-img" />
                                                </div>
                                            )}
                                            <div className="flex flex-col gap-2 max-w-[85%]">
                                                <div className={m.role === 'user' ? 'bubble-user' : 'bubble-ai'} dangerouslySetInnerHTML={{ __html: html }}></div>
                                                {finalPdfUrl && (
                                                    <div className="w-full sm:max-w-[600px] mt-4 rounded-2xl overflow-hidden border border-gray-200 shadow-2xl bg-white group flex flex-col">
                                                        <div className="relative h-[300px] sm:h-[450px] bg-gray-50 flex items-center justify-center">
                                                            <iframe
                                                                src={`http://localhost:8000/pdf-proxy?url=${encodeURIComponent(finalPdfUrl)}`}
                                                                className="w-full h-full border-none"
                                                                title="Document Preview"
                                                                onError={(e) => {
                                                                    console.log("Preview failed, showing fallback");
                                                                    e.target.style.display = 'none';
                                                                }}
                                                            ></iframe>
                                                            <div className="absolute top-3 right-3 flex gap-2">
                                                                <a href={finalPdfUrl} target="_blank" className="bg-white/95 backdrop-blur p-2 rounded-full shadow-lg hover:bg-white transition-all text-gray-700 border border-gray-100" title="Open in new tab">
                                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>
                                                                </a>
                                                            </div>
                                                        </div>
                                                        <div className="p-3 sm:p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between bg-white border-t border-gray-100 gap-3">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-9 h-9 sm:w-10 sm:h-10 bg-red-50 rounded-xl flex items-center justify-center flex-shrink-0">
                                                                    <svg className="w-5 h-5 sm:w-6 sm:h-6 text-red-800" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /><path d="M12 3v6h6" /></svg>
                                                                </div>
                                                                <div>
                                                                    <p className="text-[10px] sm:text-[11px] font-bold text-gray-900 uppercase tracking-tight">Official Document</p>
                                                                    <p className="text-[9px] sm:text-[10px] text-gray-500 font-medium">Safe Local Preview</p>
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-2 w-full sm:w-auto">
                                                                <a href={finalPdfUrl} target="_blank" className="flex-1 sm:flex-none text-center bg-gray-100 text-gray-700 px-4 py-2 rounded-full text-[9px] sm:text-[10px] font-bold uppercase tracking-widest hover:bg-gray-200 transition-all">Full View</a>
                                                                <a href={finalPdfUrl} download className="flex-1 sm:flex-none text-center bg-red-800 text-white px-4 py-2 rounded-full text-[9px] sm:text-[10px] font-bold uppercase tracking-widest hover:bg-red-900 transition-all shadow-md">Download</a>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                {status && (
                                    <div className="flex items-center ml-14 gap-4 text-red-800 font-bold text-[10px] uppercase tracking-widest">
                                        <div className="flex gap-1.5">
                                            <div className="w-2 h-2 bg-red-800 rounded-full animate-bounce"></div>
                                            <div className="w-2 h-2 bg-red-800 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                            <div className="w-2 h-2 bg-red-800 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                                        </div>
                                        {status}
                                    </div>
                                )}
                                {/* EXTRA SPACER TO PREVENT OVERLAP WITH FLOATING BAR */}
                                <div ref={scrollRef} style={{ height: '240px', width: '100%' }} />
                            </div>
                        </div>

                        <div className="floating-controls">
                            <div className="floating-inner">
                {/* Shortcut Buttons */}
                <div class="flex flex-wrap justify-center gap-2 mb-4 w-full px-4 overflow-x-auto pb-2 no-scrollbar">
                    {['Admission Process', 'Available Courses', 'Placement Stats', 'Scholarships'].map((btn) => (
                        <button 
                            key={btn}
                            onClick={() => send(btn)}
                            class="px-4 py-2 bg-white border border-[#800000] text-[#800000] rounded-full text-xs font-semibold hover:bg-[#800000] hover:text-white transition-all whitespace-nowrap shadow-sm pointer-events-auto"
                        >
                            {btn}
                        </button>
                    ))}
                </div>
                                <div className="search-bar">
                                    <input
                                        type="text"
                                        className="flex-1 bg-transparent outline-none text-[15px] sm:text-[16px] text-gray-800 placeholder-gray-400 font-medium"
                                        placeholder="Type your academic query here..."
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && send()}
                                    />
                                    <button onClick={() => send()} className="send-btn">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5"><path d="M12 19V5m-7 7l7-7 7 7" /></svg>
                                    </button>
                                </div>
                                <div className="branding">
                                    <p className="branding-text">Biyani Group of Colleges • Excellence Since 2005</p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<ChatApp />);
    </script>
</body>

</html>
