<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biyani AI Assistant | Professional Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            font-family: 'Outfit', sans-serif;
            background-color: #fff;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* FULL IMMERSIVE SHELL */
        .app-shell {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw !important;
            background: #fff;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* SIDEBAR - DESKTOP ONLY */
        .sidebar {
            display: none;
            width: 420px;
            height: 100%;
            background: #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            opacity: 0.85;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            width: 100% !important;
            position: relative;
        }

        .nav-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .website-btn {
            background: #8b0000;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .website-btn:hover {
            background: #ffffff;
            color: #8b0000;
            border-color: #8b0000;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.2);
        }

        .msg-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            padding-bottom: 220px;
            scroll-behavior: smooth;
        }

        .msg-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* BUBBLES */
        .ai-row {
            display: flex;
            align-items: flex-start;
            max-width: 95%;
            margin-right: auto;
        }

        .user-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-left: auto;
        }

        .bubble-ai {
            background: #ffffff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-left-radius: 0.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            color: #333;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .bubble-user {
            background: #001e61;
            color: #fff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-right-radius: 0.2rem;
            max-width: 85%;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 30, 97, 0.15);
        }

        /* FLOATING CONTROLS */
        .floating-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 1rem;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            pointer-events: none;
            z-index: 200;
            background: linear-gradient(to top, white 60%, transparent 100%);
        }

        .floating-inner {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .pills-row {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .pills-row::-webkit-scrollbar { display: none; }

        .pill {
            background: white;
            color: #8b0000;
            border: 1.5px solid #8b0000;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .pill:hover {
            background: #8b0000;
            color: #fff;
            transform: translateY(-2px);
        }

        .search-bar {
            background: #ffffff;
            border-radius: 4rem;
            padding: 0.4rem 0.5rem 0.4rem 1.5rem;
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .send-btn {
            background: #8b0000;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:active { transform: scale(0.9); }

        .branding {
            text-align: center;
            margin-top: 0.5rem;
            opacity: 0.5;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #6b7280;
            text-transform: uppercase;
        }

        /* AVATAR */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            margin-right: 10px;
            background: #f8f8f8;
            padding: 4px;
            flex-shrink: 0;
            border: 1px solid #eee;
        }

        /* MOBILE */
        @media (max-width: 640px) {
            .msg-scroll { padding-bottom: 240px; }
            .bubble-ai, .bubble-user { font-size: 0.9rem; padding: 0.8rem 1.1rem; }
            .sidebar { display: none; }
        }

        /* DESKTOP */
        @media (min-width: 1025px) {
            .sidebar { display: block; }
            .nav-header { padding: 1.2rem 3.5rem; }
            .pills-row { justify-content: center; }
        }

        /* ANIMATIONS */
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ChatApp = () => {
            const [messages, setMessages] = useState([
                {
                    role: 'assistant',
                    content: 'Dear student,\nWelcome to **Biyani AI Assistant**. I am here to help you with admissions, courses, and academic queries. How can I assist you today?\n\n**-Team Biyani.**'
                }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [messages, status]);

            const format = (text) => {
                if (!text) return { html: '', pdfUrl: null };
                
                let pdfUrl = null;
                const pdfMatch = text.match(/https?:\/\/[^\s]+\.pdf/i);
                if (pdfMatch) pdfUrl = pdfMatch[0];

                let html = text
                    .replace(/\*\*(.*?)\*\*/g, '<b class="text-[#8b0000]">$1</b>')
                    .replace(/^\s*[\-\*\+]\s+(.*)/gm, '<li class="ml-4 list-disc mb-1">$1</li>')
                    .replace(/\n/g, '<br/>');

                return { html, pdfUrl };
            };

            const simulateTyping = (fullText, pdfUrl) => {
                let currentText = "";
                let i = 0;
                setIsTyping(true);
                
                // Add empty message placeholder
                setMessages(prev => [...prev, { role: 'assistant', content: '', isTyping: true }]);
                
                const interval = setInterval(() => {
                    if (i < fullText.length) {
                        currentText += fullText[i];
                        setMessages(prev => {
                            const newMessages = [...prev];
                            newMessages[newMessages.length - 1].content = currentText;
                            return newMessages;
                        });
                        i++;
                    } else {
                        clearInterval(interval);
                        setIsTyping(false);
                        setMessages(prev => {
                            const newMessages = [...prev];
                            newMessages[newMessages.length - 1].isTyping = false;
                            newMessages[newMessages.length - 1].pdfUrl = pdfUrl;
                            return newMessages;
                        });
                    }
                }, 8); // Fast typing
            };

            const send = async (val) => {
                const text = val || input.trim();
                if (!text || isTyping) return;

                setInput('');
                setMessages(p => [...p, { role: 'user', content: text }]);
                setStatus('Consulting Counselor...');

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text }) // History handled by server session
                    });

                    if (!res.ok) throw new Error('API Error');
                    
                    const data = await res.json();
                    setStatus('');
                    simulateTyping(data.answer, data.pdf_url);
                } catch (e) {
                    setStatus('');
                    setMessages(p => [...p, { role: 'assistant', content: "Sorry, I'm having trouble connecting. Please try again or call **0141-2338591**." }]);
                }
            };

            return (
                <div className="app-shell">
                    <aside className="sidebar">
                        <img src="./assets/AI_image.png" className="hero-img" alt="Biyani" />
                        <div className="sidebar-overlay"></div>
                    </aside>
                    
                    <main className="chat-area">
                        <header className="nav-header">
                            <div className="flex items-center gap-3">
                                <div className="p-1 bg-white rounded shadow-sm border border-gray-100">
                                    <img src="./assets/Biyani_college_logo.jpg" className="h-8 w-8 sm:h-10 sm:w-10 object-contain" />
                                </div>
                                <div>
                                    <h2 className="font-bold text-gray-900 text-lg sm:text-xl tracking-tight">Biyani AI Assistant</h2>
                                    <p className="text-[10px] text-green-600 font-bold uppercase tracking-widest leading-none">Online Counselor</p>
                                </div>
                            </div>
                            <a href="https://www.biyanicolleges.org" target="_blank" className="website-btn">
                                Website <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>
                            </a>
                        </header>

                        <div className="msg-scroll">
                            <div className="msg-inner">
                                {messages.map((m, i) => {
                                    const { html, pdfUrl } = format(m.content);
                                    const finalPdf = m.pdfUrl || pdfUrl;
                                    return (
                                        <div key={i} className={`${m.role === 'user' ? 'user-row' : 'ai-row'} fade-in`}>
                                            {m.role === 'assistant' && (
                                                <div className="avatar">
                                                    <img src="./assets/Biyani_college_logo.jpg" className="w-full h-full object-contain" />
                                                </div>
                                            )}
                                            <div className="flex flex-col gap-2 max-w-[85%]">
                                                <div className={m.role === 'user' ? 'bubble-user' : 'bubble-ai'} 
                                                     dangerouslySetInnerHTML={{ __html: html }}></div>
                                                
                                                {finalPdf && !m.isTyping && (
                                                    <div className="mt-3 rounded-xl overflow-hidden border border-gray-200 shadow-lg bg-white">
                                                        <iframe 
                                                            src={`/api/pdf-proxy?url=${encodeURIComponent(finalPdf)}`} 
                                                            className="w-full h-[300px] sm:h-[400px] border-none"
                                                        ></iframe>
                                                        <div className="p-3 bg-gray-50 flex justify-between items-center border-t border-gray-100">
                                                            <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Official Document</span>
                                                            <a href={finalPdf} target="_blank" className="text-[10px] font-bold text-[#8b0000] uppercase hover:underline">Full Screen &rarr;</a>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                {status && (
                                    <div className="flex items-center ml-12 gap-3 text-[#8b0000] font-bold text-[10px] uppercase tracking-widest animate-pulse">
                                        <div className="w-1.5 h-1.5 bg-[#8b0000] rounded-full"></div>
                                        {status}
                                    </div>
                                )}
                                <div ref={scrollRef} />
                            </div>
                        </div>

                        <div className="floating-controls">
                            <div className="floating-inner">
                                <div className="pills-row">
                                    {['Admission Process', 'Courses Offered', 'Placement Stats', 'Scholarships'].map(p => (
                                        <button key={p} onClick={() => send(p)} className="pill">{p}</button>
                                    ))}
                                </div>
                                
                                <div className="search-bar">
                                    <input
                                        type="text"
                                        className="flex-1 bg-transparent outline-none text-[16px] text-gray-800 placeholder-gray-400"
                                        placeholder="Ask about admissions, fees, or courses..."
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && send()}
                                    />
                                    <button onClick={() => send()} className="send-btn">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><path d="M12 19V5m-7 7l7-7 7 7" /></svg>
                                    </button>
                                </div>
                                <div className="branding">
                                    Biyani Group of Colleges • Academic Excellence Since 2005
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChatApp />);
    </script>
</body>

</html>
