<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biyani AI Assistant | Professional Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            font-family: 'Outfit', sans-serif;
            background-color: #fff;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* FULL IMMERSIVE SHELL */
        .app-shell {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw !important;
            background: #fff;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* SIDEBAR - DESKTOP ONLY */
        .sidebar {
            display: none;
            width: 420px;
            height: 100%;
            background: #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            opacity: 0.85;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            width: 100% !important;
            position: relative;
        }

        .nav-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .website-btn {
            background: #8b0000;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .website-btn:hover {
            background: #ffffff;
            color: #8b0000;
            border-color: #8b0000;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.2);
        }

        .msg-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            padding-bottom: 220px;
            scroll-behavior: smooth;
        }

        .msg-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* BUBBLES */
        .ai-row {
            display: flex;
            align-items: flex-start;
            max-width: 95%;
            margin-right: auto;
        }

        .user-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-left: auto;
        }

        .bubble-ai {
            background: #ffffff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-left-radius: 0.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            color: #333;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .bubble-ai li::marker {
            color: #8b0000;
        }

        .bubble-user {
            background: #001e61;
            color: #fff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-right-radius: 0.2rem;
            max-width: 85%;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 30, 97, 0.15);
        }

        /* FLOATING CONTROLS */
        .floating-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 1rem;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            pointer-events: none;
            z-index: 200;
            background: linear-gradient(to top, white 60%, transparent 100%);
        }

        .floating-inner {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .pills-row {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .pills-row::-webkit-scrollbar {
            display: none;
        }

        .pill {
            background: white;
            color: #8b0000;
            border: 1.5px solid #8b0000;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .pill:hover {
            background: #8b0000;
            color: #fff;
            transform: translateY(-2px);
        }

        .search-bar {
            background: #ffffff;
            border-radius: 4rem;
            padding: 0.4rem 0.5rem 0.4rem 1.5rem;
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .send-btn {
            background: #8b0000;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:active {
            transform: scale(0.9);
        }

        .branding {
            text-align: center;
            margin-top: 0.5rem;
            opacity: 0.5;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #6b7280;
            text-transform: uppercase;
        }

        /* AVATAR */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            margin-right: 10px;
            background: #f8f8f8;
            padding: 4px;
            flex-shrink: 0;
            border: 1px solid #eee;
        }

        /* MOBILE */
        @media (max-width: 640px) {
            .msg-scroll {
                padding-bottom: 240px;
            }

            .bubble-ai,
            .bubble-user {
                font-size: 0.9rem;
                padding: 0.8rem 1.1rem;
            }

            .sidebar {
                display: none;
            }
        }

        /* DESKTOP */
        @media (min-width: 1025px) {
            .sidebar {
                display: block;
            }

            .nav-header {
                padding: 1.2rem 3.5rem;
            }

            .pills-row {
                justify-content: center;
            }
        }

        /* ANIMATIONS */
        .fade-in {
            animation: fadeIn 0.3s ease-in forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ChatApp = () => {
            const [messages, setMessages] = useState([
                {
                    role: 'assistant',
                    content: 'Namaste! 🙏 Welcome to **Biyani AI Assistant**.\nI am your dedicated counselor for admissions, course details, and everything Biyani. How can I help you shape your future today?'
                }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [userScrolledUp, setUserScrolledUp] = useState(false);
            const scrollRef = useRef(null);
            const containerRef = useRef(null);
            const typingIntervalRef = useRef(null);

            const handleScroll = () => {
                if (!containerRef.current) return;
                const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
                // If user scrolls up more than 100px from the bottom, mark as scrolled up
                const isNearBottom = scrollHeight - scrollTop - clientHeight < 100;
                setUserScrolledUp(!isNearBottom);
            };

            useEffect(() => {
                if (!userScrolledUp && containerRef.current) {
                    if (isTyping) {
                        // Instant snap during fast typing to prevent smooth-scroll lag
                        containerRef.current.scrollTop = containerRef.current.scrollHeight;
                    } else {
                        // Smooth scroll for new messages
                        containerRef.current.scrollTo({
                            top: containerRef.current.scrollHeight,
                            behavior: 'smooth'
                        });
                    }
                }
            }, [messages, status, isTyping]);

            const format = (text) => {
                if (!text) return { html: '', pdfUrl: null };

                let pdfUrl = null;
                const pdfMatch = text.match(/https?:\/\/[^\s]+\.pdf/i);
                if (pdfMatch) pdfUrl = pdfMatch[0];

                let html = text
                    .replace(/\[\s*CTA\s*\]([\s\S]*?)\[\s*\/?\s*CTA\s*\]/gi, '<div class="mt-2 p-3 rounded-xl bg-gray-50 border border-gray-100 relative group"><h4 class="text-[#8b0000] text-[13px] font-bold mb-1">Biyani Group Admission Cell</h4><div class="flex flex-col gap-0.5"><div class="flex items-center gap-2"><span class="text-[10px] opacity-70">📍</span><p class="text-[10px] text-gray-500">Sector-3, Vidhyadhar Nagar, Jaipur (Raj.) 302039</p></div><div class="flex items-center gap-2"><span class="text-[10px] opacity-70">📞</span><p class="text-[11px] text-[#001e61] font-bold">8696218218 / 8290636942</p></div><div class="flex items-center gap-2 mt-1.5 pt-1.5 border-t border-gray-200/50"><a href="https://wa.me/918290636942" target="_blank" class="flex items-center gap-1 bg-[#25D366] text-white px-2 py-0.5 rounded-md text-[9px] font-bold transition-transform active:scale-95 shadow-sm"><span>💬</span> WhatsApp</a><a href="mailto:admissions@biyanicolleges.org" class="flex items-center gap-1 bg-[#001e61] text-white px-2 py-0.5 rounded-md text-[9px] font-bold transition-transform active:scale-95 shadow-sm"><span>✉️</span> Email</a></div></div></div>')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" class="text-[#8b0000] font-bold underline hover:text-[#001e61] transition-colors">$1</a>')
                    .replace(/(?<!["'])(https?:\/\/[^\s<]+)/gi, '<a href="$1" target="_blank" class="text-[#8b0000] font-bold underline hover:text-[#001e61] transition-colors">$1</a>');

                // Basic Table Parser
                if (html.includes('|') && html.includes('---')) {
                    const lines = html.split('\n');
                    let inTable = false;
                    let tableHtml = '<div class="overflow-x-auto my-4"><table class="w-full text-sm border-collapse border border-gray-200 rounded-lg overflow-hidden">';
                    let processedHtml = [];

                    for (let line of lines) {
                        if (line.includes('|')) {
                            if (!inTable) inTable = true;
                            const cells = line.split('|').filter(c => c.trim() !== '' || line.indexOf('|') !== line.lastIndexOf('|')).map(c => c.trim());
                            if (line.includes('---')) continue; // Skip separator

                            const isHeader = !line.includes('---') && !inTable; // Simplified header check
                            tableHtml += `<tr class="${isHeader ? 'bg-gray-50 font-bold' : 'bg-white'}">`;
                            cells.forEach(cell => {
                                tableHtml += `<td class="border border-gray-200 p-2">${cell}</td>`;
                            });
                            tableHtml += '</tr>';
                        } else {
                            if (inTable) {
                                inTable = false;
                                tableHtml += '</table></div>';
                                processedHtml.push(tableHtml);
                                tableHtml = '<div class="overflow-x-auto my-4"><table class="w-full text-sm border-collapse border border-gray-200 rounded-lg overflow-hidden">';
                            }
                            processedHtml.push(line);
                        }
                    }
                    if (inTable) {
                        tableHtml += '</table></div>';
                        processedHtml.push(tableHtml);
                    }
                    html = processedHtml.join('\n');
                }

                html = html
                    .replace(/^##### (.*$)/gim, '<h5 class="text-[14px] font-bold text-[#8b0000] mt-2 mb-1">$1</h5>')
                    .replace(/^#### (.*$)/gim, '<h4 class="text-[15px] font-bold text-[#8b0000] mt-3 mb-1">$1</h4>')
                    .replace(/^### (.*$)/gim, '<h3 class="text-[17px] font-bold text-[#8b0000] mt-4 mb-1">$1</h3>')
                    .replace(/^## (.*$)/gim, '<h2 class="text-lg font-bold text-[#001e61] mt-5 mb-2">$1</h2>')
                    .replace(/^# (.*$)/gim, '<h1 class="text-xl font-extrabold text-[#001e61] mt-5 mb-2 border-b pb-1">$1</h1>')
                    .replace(/\*\*(.*?)\*\*/g, '<b class="text-[#8b0000]">$1</b>')
                    .replace(/^\s*[\-\*\+]\s+(.*)/gm, '<li class="ml-4 list-disc mb-1">$1</li>')
                    .replace(/\n\n/g, '<div class="h-2"></div>')
                    .replace(/\n/g, '<br/>');

                return { html, pdfUrl };
            };

            const simulateTyping = (fullText, pdfUrl) => {
                const startTime = Date.now();
                const speed = 2; // 2ms per character (Ultra Fast)
                setIsTyping(true);

                setMessages(prev => [...prev, { role: 'assistant', content: '', isTyping: true }]);

                const tick = () => {
                    const elapsed = Date.now() - startTime;
                    const charCount = Math.floor(elapsed / speed);
                    
                    if (charCount <= fullText.length) {
                        const currentText = fullText.slice(0, charCount);
                        setMessages(prev => {
                            const newMessages = [...prev];
                            const last = newMessages[newMessages.length - 1];
                            if (last && last.isTyping) {
                                last.content = currentText;
                            }
                            return newMessages;
                        });
                        
                        if (charCount < fullText.length) {
                            typingIntervalRef.current = requestAnimationFrame(tick);
                        } else {
                            finish();
                        }
                    } else {
                        finish();
                    }
                };

                const finish = () => {
                    cancelAnimationFrame(typingIntervalRef.current);
                    setIsTyping(false);
                    setMessages(prev => {
                        const newMessages = [...prev];
                        const last = newMessages[newMessages.length - 1];
                        if (last && last.isTyping) {
                            last.content = fullText;
                            last.isTyping = false;
                            last.pdfUrl = pdfUrl;
                        }
                        return newMessages;
                    });
                };

                typingIntervalRef.current = requestAnimationFrame(tick);
            };

            const send = async (val) => {
                const text = val || input.trim();
                if (!text || isTyping || status) return;

                setInput('');
                setUserScrolledUp(false); // Reset scroll lock on new message
                setMessages(p => [...p, { role: 'user', content: text }]);
                setStatus('Consulting AI Counselor...');

                try {
                    // Prepare history (last 6 valid messages)
                    const historyPayload = messages
                        .filter(m => !m.isTyping && m.content)
                        .slice(-6)
                        .map(m => ({ role: m.role, content: m.content }));

                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, history: historyPayload })
                    });

                    if (!res.ok) throw new Error('API Error');

                    const data = await res.json();
                    setStatus('');
                    simulateTyping(data.answer, data.pdf_url);
                } catch (e) {
                    setStatus('');
                    setMessages(p => [...p, { role: 'assistant', content: "Mafi chahta hoon, connection mein problem hai. Please 0141-2338591 par call karein." }]);
                }
            };

            const resetChat = () => {
                if (isTyping) return;
                setMessages([
                    {
                        role: 'assistant',
                        content: 'Namaste! 🙏 Welcome to **Biyani AI Assistant**.\nI am your dedicated counselor for admissions, course details, and everything Biyani. How can I help you shape your future today?'
                    }
                ]);
                setInput('');
                setStatus('');
                setIsTyping(false);
            };

            return (
                <div className="app-shell relative">
                    <aside className="sidebar">
                        <img src="./assets/AI_image.png" className="hero-img" alt="Biyani" />
                        <div className="sidebar-overlay"></div>
                        <div className="absolute bottom-10 left-10 text-white z-10">
                            <h3 className="text-4xl font-bold mb-2">Think Different.</h3>
                            <p className="text-lg opacity-80 font-light italic">Empowering Women, Educating India.</p>
                        </div>
                    </aside>

                    <main className="chat-area">
                        <header className="nav-header">
                            <div className="flex items-center gap-3">
                                <div className="p-1 bg-white rounded-xl shadow-md border border-gray-100 transform -rotate-3">
                                    <img src="./assets/Biyani_college_logo.jpg" className="h-8 w-8 sm:h-10 sm:w-10 object-contain" />
                                </div>
                                <div>
                                    <h2 className="font-bold text-[#001e61] text-lg sm:text-xl tracking-tight leading-none mb-1">Biyani Assistant</h2>
                                    <div className="flex items-center gap-1.5">
                                        <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                                        <p className="text-[9px] text-gray-500 font-bold uppercase tracking-widest leading-none">Active Counselor</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={resetChat} className="p-2.5 rounded-full bg-gray-50 text-gray-600 hover:bg-[#8b0000] hover:text-white transition-all shadow-sm" title="Reset Chat">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" /><path d="M16 21v-5h5" /></svg>
                                </button>
                                <a href="tel:01412338591" className="p-2.5 rounded-full bg-gray-50 text-gray-600 hover:bg-[#8b0000] hover:text-white transition-all shadow-sm block sm:hidden" title="Call Us">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.19-2.19a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" /></svg>
                                </a>
                                <a href="https://www.biyanicolleges.org" target="_blank" className="website-btn">
                                    <span className="hidden sm:inline">Official</span> Website <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>
                                </a>
                            </div>
                        </header>

                        <div className="msg-scroll" ref={containerRef} onScroll={handleScroll}>
                            <div className="msg-inner">
                                {messages.map((m, i) => {
                                    const { html, pdfUrl } = format(m.content);
                                    const finalPdf = m.pdfUrl || pdfUrl;
                                    return (
                                        <div key={i} className={`${m.role === 'user' ? 'user-row' : 'ai-row'} fade-in`}>
                                            {m.role === 'assistant' && (
                                                <div className="avatar ring-2 ring-gray-50 overflow-hidden">
                                                    <img src="./assets/Biyani_college_logo.jpg" className="w-full h-full object-contain" />
                                                </div>
                                            )}
                                            <div className="flex flex-col gap-2 max-w-[85%]">
                                                <div className={m.role === 'user' ? 'bubble-user shadow-[#001e6122]' : 'bubble-ai shadow-sm'}
                                                    dangerouslySetInnerHTML={{ __html: html }}></div>

                                                {finalPdf && !m.isTyping && (
                                                    <div className="mt-3 rounded-2xl overflow-hidden border border-gray-200 shadow-2xl bg-white animate-fadeIn">
                                                        <iframe
                                                            src={`/api/pdf-proxy?url=${encodeURIComponent(finalPdf)}`}
                                                            className="w-full h-[300px] sm:h-[450px] border-none"
                                                        ></iframe>
                                                        <div className="p-4 bg-[#f8f9fa] flex justify-between items-center border-t border-gray-100">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
                                                                <span className="text-[10px] font-bold text-gray-600 uppercase tracking-widest">Live Document Viewer</span>
                                                            </div>
                                                            <a href={finalPdf} target="_blank" className="bg-white px-3 py-1.5 rounded-lg text-[10px] font-bold text-[#8b0000] border border-gray-200 shadow-sm hover:bg-[#8b0000] hover:text-white transition-all uppercase">Full View &rarr;</a>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                {status && (
                                    <div className="flex items-center ml-12 gap-3 text-[#8b0000] font-bold text-[10px] uppercase tracking-[0.2em] animate-pulse">
                                        <div className="flex gap-1">
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full"></div>
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full animate-bounce"></div>
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full"></div>
                                        </div>
                                        {status}
                                    </div>
                                )}
                                <div ref={scrollRef} />
                            </div>
                        </div>

                        {/* Scroll to Bottom Button */}
                        {userScrolledUp && (
                            <button
                                onClick={() => {
                                    setUserScrolledUp(false);
                                    setTimeout(() => {
                                        if (containerRef.current) {
                                            containerRef.current.scrollTo({
                                                top: containerRef.current.scrollHeight,
                                                behavior: 'smooth'
                                            });
                                        }
                                    }, 10);
                                }}
                                className="absolute bottom-[210px] sm:bottom-[190px] left-1/2 -translate-x-1/2 w-11 h-11 bg-white text-gray-600 rounded-full shadow-[0_8px_25px_rgba(0,30,97,0.2)] border border-gray-100 hover:text-[#8b0000] hover:bg-white animate-fadeIn z-[500] transition-all hover:scale-110 active:scale-95 flex items-center justify-center group"
                                title="Scroll to bottom"
                            >
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="transform group-hover:translate-y-1 transition-transform"><path d="M12 5v14M19 12l-7 7-7-7" /></svg>
                            </button>
                        )}

                        <div className="floating-controls">
                            <div className="floating-inner px-2">
                                <div className="pills-row pb-2">
                                    {['Admission Process', 'List of All Courses', 'Placement Stats', 'Fees Structure', 'Scholarships'].map(p => (
                                        <button key={p} onClick={() => send(p)} className="pill shadow-sm border-gray-200 hover:border-[#8b0000]">{p}</button>
                                    ))}
                                </div>

                                <div className="search-bar group border-gray-200 focus-within:border-[#8b0000] focus-within:ring-4 focus-within:ring-[#8b000011] transition-all">
                                    <input
                                        type="text"
                                        className="flex-1 bg-transparent outline-none text-[16px] text-gray-800 placeholder-gray-400 py-3 disabled:opacity-50 disabled:cursor-not-allowed"
                                        placeholder={isTyping || status ? "AI is typing..." : "Type your academic query..."}
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && send()}
                                        disabled={isTyping || !!status}
                                    />
                                    <button
                                        onClick={() => !isTyping && !status && send()}
                                        className={`send-btn transition-transform ${isTyping || status ? 'bg-gray-400 cursor-not-allowed opacity-50 shadow-none' : 'shadow-lg shadow-[#8b000044] hover:scale-105 active:scale-95'}`}
                                        disabled={isTyping || !!status}
                                    >
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><path d="M12 19V5m-7 7l7-7 7 7" /></svg>
                                    </button>
                                </div>
                                <div className="flex flex-col items-center gap-1 mt-3">
                                    <div className="flex gap-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider justify-center">
                                        <a href="tel:+91-8290636942" className="hover:text-[#8b0000]">📞+91-8290636942 </a>
                                        <span className="opacity-30">|</span>
                                        <a href="https://www.biyanicolleges.org" target="_blank" className="hover:text-[#8b0000]">🌐 BiyaniColleges.org</a>
                                    </div>
                                    <p className="text-[10px] text-gray-400 font-medium tracking-tight">
                                        Biyani AI can make mistakes. Check important info.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChatApp />);
    </script>
</body>

</html>
