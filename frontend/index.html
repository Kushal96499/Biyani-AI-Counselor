<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biyani AI Assistant | Professional Counselor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            font-family: 'Outfit', sans-serif;
            background-color: #fff;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* FULL IMMERSIVE SHELL */
        .app-shell {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw !important;
            background: #fff;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* SIDEBAR - DESKTOP ONLY */
        .sidebar {
            display: none;
            width: 420px;
            height: 100%;
            background: #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            opacity: 0.85;
        }

        .sidebar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            height: 100%;
            width: 100% !important;
            position: relative;
        }

        .nav-header {
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .website-btn {
            background: #8b0000;
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .website-btn:hover {
            background: #ffffff;
            color: #8b0000;
            border-color: #8b0000;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 0, 0, 0.2);
        }

        .msg-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            padding-bottom: 220px;
            scroll-behavior: smooth;
        }

        .msg-inner {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* BUBBLES */
        .ai-row {
            display: flex;
            align-items: flex-start;
            max-width: 95%;
            margin-right: auto;
        }

        .user-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            margin-left: auto;
        }

        .bubble-ai {
            background: #ffffff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-left-radius: 0.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
            color: #333;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .bubble-user {
            background: #001e61;
            color: #fff;
            padding: 1rem 1.4rem;
            border-radius: 1.5rem;
            border-top-right-radius: 0.2rem;
            max-width: 85%;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 30, 97, 0.15);
        }

        /* FLOATING CONTROLS */
        .floating-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 1rem;
            padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
            pointer-events: none;
            z-index: 200;
            background: linear-gradient(to top, white 60%, transparent 100%);
        }

        .floating-inner {
            max-width: 850px;
            margin: 0 auto;
            width: 100%;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .pills-row {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }

        .pills-row::-webkit-scrollbar { display: none; }

        .pill {
            background: white;
            color: #8b0000;
            border: 1.5px solid #8b0000;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .pill:hover {
            background: #8b0000;
            color: #fff;
            transform: translateY(-2px);
        }

        .search-bar {
            background: #ffffff;
            border-radius: 4rem;
            padding: 0.4rem 0.5rem 0.4rem 1.5rem;
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .send-btn {
            background: #8b0000;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .send-btn:active { transform: scale(0.9); }

        .branding {
            text-align: center;
            margin-top: 0.5rem;
            opacity: 0.5;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #6b7280;
            text-transform: uppercase;
        }

        /* AVATAR */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            margin-right: 10px;
            background: #f8f8f8;
            padding: 4px;
            flex-shrink: 0;
            border: 1px solid #eee;
        }

        /* MOBILE */
        @media (max-width: 640px) {
            .msg-scroll { padding-bottom: 240px; }
            .bubble-ai, .bubble-user { font-size: 0.9rem; padding: 0.8rem 1.1rem; }
            .sidebar { display: none; }
        }

        /* DESKTOP */
        @media (min-width: 1025px) {
            .sidebar { display: block; }
            .nav-header { padding: 1.2rem 3.5rem; }
            .pills-row { justify-content: center; }
        }

        /* ANIMATIONS */
        .fade-in { animation: fadeIn 0.3s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ChatApp = () => {
            const [showWelcome, setShowWelcome] = useState(true);
            const [messages, setMessages] = useState([
                {
                    role: 'assistant',
                    content: 'Namaste! 🙏 Welcome to **Biyani AI Assistant**.\nI am your dedicated counselor for admissions, course details, and everything Biyani. How can I help you shape your future today?'
                }
            ]);
            const [input, setInput] = useState('');
            const [status, setStatus] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [userScrolledUp, setUserScrolledUp] = useState(false);
            const scrollRef = useRef(null);
            const containerRef = useRef(null);

            useEffect(() => {
                const timer = setTimeout(() => setShowWelcome(false), 3500);
                return () => clearTimeout(timer);
            }, []);

            const handleScroll = () => {
                if (!containerRef.current) return;
                const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
                // If user scrolls up more than 100px from the bottom, mark as scrolled up
                const isNearBottom = scrollHeight - scrollTop - clientHeight < 100;
                setUserScrolledUp(!isNearBottom);
            };

            useEffect(() => {
                if (!userScrolledUp && scrollRef.current) {
                    scrollRef.current.scrollIntoView({ behavior: "smooth", block: "end" });
                }
            }, [messages, status]);

            const format = (text) => {
                if (!text) return { html: '', pdfUrl: null };
                
                let pdfUrl = null;
                const pdfMatch = text.match(/https?:\/\/[^\s]+\.pdf/i);
                if (pdfMatch) pdfUrl = pdfMatch[0];

                let html = text
                    .replace(/\[\s*CTA\s*\]([\s\S]*?)\[\s*\/?\s*CTA\s*\]/gi, '<div class="bg-[#8b0000] text-white [&_b]:text-white p-3 rounded-xl mt-4 text-[13px] sm:text-sm font-medium shadow-md border border-white/20 leading-relaxed">$1</div>')
                    .replace(/\*\*(.*?)\*\*/g, '<b class="text-[#8b0000]">$1</b>')
                    .replace(/^\s*[\-\*\+]\s+(.*)/gm, '<li class="ml-4 list-disc mb-1 text-gray-700 font-normal">$1</li>')
                    .replace(/\n/g, '<br/>');

                return { html, pdfUrl };
            };

            const simulateTyping = (fullText, pdfUrl) => {
                let currentText = "";
                let i = 0;
                setIsTyping(true);
                
                setMessages(prev => [...prev, { role: 'assistant', content: '', isTyping: true }]);
                
                const interval = setInterval(() => {
                    if (i < fullText.length) {
                        currentText += fullText[i];
                        setMessages(prev => {
                            const newMessages = [...prev];
                            newMessages[newMessages.length - 1].content = currentText;
                            return newMessages;
                        });
                        i++;
                    } else {
                        clearInterval(interval);
                        setIsTyping(false);
                        setMessages(prev => {
                            const newMessages = [...prev];
                            newMessages[newMessages.length - 1].isTyping = false;
                            newMessages[newMessages.length - 1].pdfUrl = pdfUrl;
                            return newMessages;
                        });
                    }
                }, 6); 
            };

            const send = async (val) => {
                const text = val || input.trim();
                if (!text || isTyping) return;

                setInput('');
                setMessages(p => [...p, { role: 'user', content: text }]);
                setStatus('Consulting AI Counselor...');

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });

                    if (!res.ok) throw new Error('API Error');
                    
                    const data = await res.json();
                    setStatus('');
                    simulateTyping(data.answer, data.pdf_url);
                } catch (e) {
                    setStatus('');
                    setMessages(p => [...p, { role: 'assistant', content: "Mafi chahta hoon, connection mein problem hai. Please 0141-2338591 par call karein." }]);
                }
            };

            return (
                <div className="app-shell relative">
                    {/* Welcome Center Modal with Blur */}
                    {showWelcome && (
                        <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4 backdrop-blur-2xl bg-gradient-to-br from-[#001e61]/30 to-[#8b0000]/20 animate-fadeIn">
                            {/* Enhanced glowing blobs */}
                            <div className="absolute top-1/2 left-1/2 -translate-x-[70%] -translate-y-[70%] w-[350px] h-[350px] bg-[#8b0000]/30 rounded-full blur-[100px] animate-pulse [animation-duration:4s]"></div>
                            <div className="absolute top-1/2 left-1/2 translate-x-[20%] translate-y-[20%] w-[300px] h-[300px] bg-[#001e61]/30 rounded-full blur-[100px] animate-pulse [animation-duration:5s] delay-1000"></div>

                            {/* Ultra Premium Glass Card */}
                            <div className="relative bg-white/70 backdrop-blur-3xl p-10 sm:p-14 rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.15),0_0_80px_rgba(139,0,0,0.1)] text-center border border-white transform transition-all duration-700 overflow-hidden group w-full max-w-sm">
                                {/* Inner shine effect */}
                                <div className="absolute inset-0 bg-gradient-to-tr from-white/10 via-white/80 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>
                                
                                <div className="relative">
                                    {/* Floating Emoji */}
                                    <div className="mx-auto inline-flex items-center justify-center w-28 h-28 rounded-full bg-gradient-to-tr from-gray-50 to-white mb-6 shadow-[0_15px_30px_rgba(0,30,97,0.1)] border border-white">
                                        <div className="text-6xl animate-bounce [animation-duration:2.5s]">🙏</div>
                                    </div>
                                    
                                    {/* Gradient Header */}
                                    <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#001e61] to-[#8b0000] mb-3 tracking-tight">
                                        Namaste!
                                    </h1>
                                    
                                    {/* Subtle divider */}
                                    <div className="h-[3px] w-16 bg-gradient-to-r from-[#001e61] via-[#8b0000] to-[#001e61] mx-auto mb-5 rounded-full opacity-50"></div>
                                    
                                    <p className="text-[#8b0000] text-sm sm:text-[15px] font-black uppercase tracking-[0.2em] mb-2 drop-shadow-sm">
                                        Biyani Group of Colleges
                                    </p>
                                    <p className="text-gray-500 text-[11px] sm:text-[12px] font-semibold tracking-wider uppercase opacity-80">
                                        Opening AI Counselor...
                                    </p>
                                    
                                    {/* Bouncing Dot loaders for high visibility */}
                                    <div className="mt-10 flex justify-center gap-2.5 items-center h-6">
                                        <div className="w-3 h-3 bg-[#001e61] rounded-full animate-bounce shadow-sm"></div>
                                        <div className="w-3 h-3 bg-[#8b0000] rounded-full animate-bounce shadow-sm [animation-delay:0.15s]"></div>
                                        <div className="w-3 h-3 bg-[#001e61] rounded-full animate-bounce shadow-sm [animation-delay:0.3s]"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    <aside className="sidebar">
                        <img src="./assets/AI_image.png" className="hero-img" alt="Biyani" />
                        <div className="sidebar-overlay"></div>
                        <div className="absolute bottom-10 left-10 text-white z-10">
                            <h3 className="text-4xl font-bold mb-2">Think Different.</h3>
                            <p className="text-lg opacity-80 font-light italic">Empowering Women, Educating India.</p>
                        </div>
                    </aside>
                    
                    <main className="chat-area">
                        <header className="nav-header">
                            <div className="flex items-center gap-3">
                                <div className="p-1 bg-white rounded-xl shadow-md border border-gray-100 transform -rotate-3">
                                    <img src="./assets/Biyani_college_logo.jpg" className="h-8 w-8 sm:h-10 sm:w-10 object-contain" />
                                </div>
                                <div>
                                    <h2 className="font-bold text-[#001e61] text-lg sm:text-xl tracking-tight leading-none mb-1">Biyani Assistant</h2>
                                    <div className="flex items-center gap-1.5">
                                        <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                                        <p className="text-[9px] text-gray-500 font-bold uppercase tracking-widest leading-none">Active Counselor</p>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <a href="tel:01412338591" className="p-2.5 rounded-full bg-gray-50 text-gray-600 hover:bg-[#8b0000] hover:text-white transition-all shadow-sm block sm:hidden">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.19-2.19a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                                </a>
                                <a href="https://www.biyanicolleges.org" target="_blank" className="website-btn">
                                    <span className="hidden sm:inline">Official</span> Website <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3" /></svg>
                                </a>
                            </div>
                        </header>

                        <div className="msg-scroll" ref={containerRef} onScroll={handleScroll}>
                            <div className="msg-inner">
                                {messages.map((m, i) => {
                                    const { html, pdfUrl } = format(m.content);
                                    const finalPdf = m.pdfUrl || pdfUrl;
                                    return (
                                        <div key={i} className={`${m.role === 'user' ? 'user-row' : 'ai-row'} fade-in`}>
                                            {m.role === 'assistant' && (
                                                <div className="avatar ring-2 ring-gray-50 overflow-hidden">
                                                    <img src="./assets/Biyani_college_logo.jpg" className="w-full h-full object-contain" />
                                                </div>
                                            )}
                                            <div className="flex flex-col gap-2 max-w-[85%]">
                                                <div className={m.role === 'user' ? 'bubble-user shadow-[#001e6122]' : 'bubble-ai shadow-sm'} 
                                                     dangerouslySetInnerHTML={{ __html: html }}></div>
                                                
                                                {finalPdf && !m.isTyping && (
                                                    <div className="mt-3 rounded-2xl overflow-hidden border border-gray-200 shadow-2xl bg-white animate-fadeIn">
                                                        <iframe 
                                                            src={`/api/pdf-proxy?url=${encodeURIComponent(finalPdf)}`} 
                                                            className="w-full h-[300px] sm:h-[450px] border-none"
                                                        ></iframe>
                                                        <div className="p-4 bg-[#f8f9fa] flex justify-between items-center border-t border-gray-100">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-2 h-2 bg-red-600 rounded-full animate-pulse"></div>
                                                                <span className="text-[10px] font-bold text-gray-600 uppercase tracking-widest">Live Document Viewer</span>
                                                            </div>
                                                            <a href={finalPdf} target="_blank" className="bg-white px-3 py-1.5 rounded-lg text-[10px] font-bold text-[#8b0000] border border-gray-200 shadow-sm hover:bg-[#8b0000] hover:text-white transition-all uppercase">Full View &rarr;</a>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                                {status && (
                                    <div className="flex items-center ml-12 gap-3 text-[#8b0000] font-bold text-[10px] uppercase tracking-[0.2em] animate-pulse">
                                        <div className="flex gap-1">
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full"></div>
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full animate-bounce"></div>
                                            <div className="w-1 h-1 bg-[#8b0000] rounded-full"></div>
                                        </div>
                                        {status}
                                    </div>
                                )}
                                <div ref={scrollRef} />
                            </div>
                        </div>

                        <div className="floating-controls">
                            <div className="floating-inner px-2">
                                <div className="pills-row pb-2">
                                    {['Admission Process', 'Courses Offered', 'Placement Stats', 'Scholarships'].map(p => (
                                        <button key={p} onClick={() => send(p)} className="pill shadow-sm border-gray-200 hover:border-[#8b0000]">{p}</button>
                                    ))}
                                </div>
                                
                                <div className="search-bar group border-gray-200 focus-within:border-[#8b0000] focus-within:ring-4 focus-within:ring-[#8b000011] transition-all">
                                    <input
                                        type="text"
                                        className="flex-1 bg-transparent outline-none text-[16px] text-gray-800 placeholder-gray-400 py-3"
                                        placeholder="Type your academic query..."
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyPress={e => e.key === 'Enter' && send()}
                                    />
                                    <button onClick={() => send()} className="send-btn shadow-lg shadow-[#8b000044] hover:scale-105 active:scale-95 transition-transform">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4"><path d="M12 19V5m-7 7l7-7 7 7" /></svg>
                                    </button>
                                </div>
                                <div className="branding mt-3">
                                    Biyani Group of Colleges • Official AI Counselor 2.0
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChatApp />);
    </script>
</body>

</html>
